services:
  mysql:
    image: mysql:8.0
    container_name: sadra-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: sadra
    ports:
      - '3306:3306'
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - sadra-mysql-data:/var/lib/mysql

volumes:
  sadra-mysql-data:
